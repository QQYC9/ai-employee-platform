[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-employee-platform"
version = "0.1.0"
description = "Multi-tenant AI Employee Platform"
requires-python = ">=3.13,<3.15"

dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.52,<1.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.15,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.16,<2.0",
    "psycopg[binary]>=3.2,<4.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
