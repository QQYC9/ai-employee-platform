server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Basic security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static assets with cache-busting hashes
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # API boundary protection:
    # All API requests must be routed by the Caddy reverse proxy to the backend agent.
    # If a request to /api/ reaches this frontend Nginx container directly,
    # return 404 rather than rewriting to index.html to prevent HTML responses to API calls.
    location /api/ {
        return 404;
    }

    # SPA routing fallback: serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html so users always receive latest version
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Healthcheck endpoint for container orchestrator
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
}
