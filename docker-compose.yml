services:

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_employee_agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://ai_employee:change_me_local@postgres:5432/ai_employee
      - REDIS_URL=redis://redis:6379/0
      - ENABLE_EMBEDDED_WORKER=true
      - AI_PROVIDER=groq
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./infrastructure:/app/infrastructure
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai_employee_postgres
    environment:
      POSTGRES_DB: ai_employee
      POSTGRES_USER: ai_employee
      POSTGRES_PASSWORD: change_me_local
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai_employee_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:alpine
    container_name: ai_employee_ngrok
    restart: "no"
    profiles:
      - tunnel
    ports:
      - "127.0.0.1:4040:4040"
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN:-}"
    command:
      - "http"
      - "agent:8000"
    depends_on:
      - agent

volumes:
  postgres_data:
  redis_data:
